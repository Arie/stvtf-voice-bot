name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up without a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs the checks through script/test, the same script that runs them locally. The checkout
# keeps no credentials. Actions are pinned by commit.
jobs:
  checks:
    name: checks, tests and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # Installs the linters pinned in mise.toml, for shell scripts, the Dockerfile and the workflows.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # Pinned to the version stv.tf's CI uses: a later version could not be downloaded.
          version: 2026.11.3
      - run: script/test -v
