name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up without a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The checks run through script/test, which runs them all locally. The checkout keeps no
# credentials. Actions are pinned by commit.
jobs:
  checks:
    name: checks, tests and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # The linters mise.toml pins: shell scripts, the Dockerfile and the workflows.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Pinned, as stv.tf's: a later one could not be fetched.
          version: 2026.11.3
      - run: script/test -v
