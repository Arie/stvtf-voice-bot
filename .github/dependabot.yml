version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # What the bot runs on (discord.js, its voice) and the dev tools (ESLint, Prettier,
  # TypeScript): pinned exactly, each kind bumped together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
      dev-tools:
        dependency-type: development
    # Follows the Node the image runs: moved by hand, with it.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A Node major is moved by hand, to an LTS.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
