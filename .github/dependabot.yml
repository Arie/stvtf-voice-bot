version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Runtime dependencies (discord.js, @discordjs/voice) and dev tools (ESLint, Prettier,
  # TypeScript) are pinned to exact versions. Each group is updated in one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
      dev-tools:
        dependency-type: development
    # Must match the Node major of the Docker image: updated by hand, together with the image.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A Node major is updated by hand, and only to an LTS release.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
