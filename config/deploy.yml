# The voice bot as a Kamal app: one container, on the stv.tf host in Europe. It serves nothing
# (no proxy, no ports): it connects out, to Discord, to Mumble servers and to the stv.tf of
# whichever region a match is on.
#   bin/build && bin/deploy     (or: kamal deploy)
#
# A deploy takes the bot out of its voice channels for some seconds: it goes back into each.
service: stvtf-voice-bot
image: arie/stvtf-voice-bot

registry:
  server: ghcr.io
  username: Arie
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

servers:
  bot:
    hosts: [new.fakkelbrigade.eu]
    proxy: false
    options:
      memory: 256m

primary_role: bot

volumes:
  - stvtf-voice-bot:/data

env:
  clear:
    # The first is where people link Steam, and where who they are is asked.
    STVTF_HOSTS: stv.tf,na.stv.tf,au.stv.tf,sea.stv.tf
    # The Discord channels it is in, to go back into after a restart.
    STVTF_STATE: /data/discord.json
    # Errors are told to Sentry (SENTRY_DSN), as this version's (KAMAL_VERSION).
    SENTRY_ENVIRONMENT: production
  secret:
    - DISCORD_TOKEN
    - STVTF_VOICE_KEY
    - SENTRY_DSN

ssh:
  user: kamal
  keys: ["~/.ssh/id_kamal"]

aliases:
  logs: app logs -f
