# The voice bot as a Kamal app: one container, on the stv.tf host in Europe. It serves nothing
# (no proxy, no ports): it connects out, to Discord, to Mumble servers and to the stv.tf of
# whichever region a match is on.
#   bin/build && bin/deploy
#
# A deploy takes the bot out of its voice channels for some seconds. It rejoins each of them.
service: stvtf-voice-bot
image: arie/stvtf-voice-bot

registry:
  server: ghcr.io
  username: Arie
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

servers:
  bot:
    hosts: [new.fakkelbrigade.eu]
    proxy: false
    options:
      memory: 256m

primary_role: bot

volumes:
  - stvtf-voice-bot:/data

env:
  clear:
    # The first host is where people link Steam, and where the bot asks who a Discord user is.
    STVTF_HOSTS: stv.tf,na.stv.tf,au.stv.tf,sea.stv.tf
    # The file listing the Discord channels the bot is in, so it rejoins them after a restart.
    STVTF_STATE: /data/discord.json
    # Errors are reported to Sentry (SENTRY_DSN), with KAMAL_VERSION as the release.
    SENTRY_ENVIRONMENT: production
  secret:
    - DISCORD_TOKEN
    - STVTF_VOICE_KEY
    - SENTRY_DSN
    - STVTF_MUMBLE_CERTS

ssh:
  user: kamal
  keys: ["~/.ssh/id_kamal"]

aliases:
  logs: app logs -f
